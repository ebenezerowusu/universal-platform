[workspace]
members = [
    "crates/platform-api",
    "crates/platform-core",
    "crates/platform-config",
    "crates/platform-infra",
    "crates/platform-identity"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Proprietary"
repository = "https://github.com/ebenezerowusu/universal-platform"

[workspace.dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
